<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basicmap_operations</title>
    <script>
        function basicMapOperations(){
            let map = new Map();
            map.set('name','raj');
            map.set('age',20);
            map.set('city','TVM');

            document.getElementById('getName').innerHTML = 'Name: ' + map.get('name');
            document.getElementById('getAge').innerHTML = 'Age: ' + map.get('age');
            document.getElementById('getCity').innerHTML = 'City: ' + map.get('city');

            let output = '';
            map.forEach((value, key) => {
                output += key + ' = ' + value + '<br>';
            });

            document.getElementById('iterationOutput').innerHTML = output;
        }
    </script>
</head>
<body>
    <h1>Map Iteration</h1>

    <button onclick="basicMapOperations()">Run Map Operations</button>

    <p id="getName"></p>
    <p id="getAge"></p>
    <p id="getCity"></p>
    <p id="iterationOutput"></p>

</body>
</html>

!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q11</title>
</head>
<body>

    Enter number: <input type="number" id="numInput">
    <br><br>
    <button onclick="reverseNumber()">Reverse</button>

    <p id="result"></p>

    <script>
        function reverseNumber() {
            let n = parseInt(document.getElementById('numInput').value);
            let rev = 0;

            while (n > 0) {
                let digit = n % 10;
                rev = (rev * 10) + digit;
                n = Math.floor(n / 10);
            }

            document.getElementById('result').innerHTML = "Reversed Number is : " + rev;
        }
    </script>

</body>
</html>

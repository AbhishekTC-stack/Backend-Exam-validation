<body>

    Name:
    <input type="text"><br><br>

    Address:

    Degree:
    <input type="radio" name="degree" onclick="hideDropdown()"> Btech
    <input type="radio" name="degree" onclick="hideDropdown()"> Mtech
    <input type="radio" name="degree" onclick="hideDropdown()"> MCA
    <input type="radio" name="degree" onclick="showDropdown()"> Others
    <br><br>

    <div id="otherDegree">
        Select Degree:
        <select>
            <option>BCA</option>
            <option>PGDCA</option>
            <option>BCom</option>
            <option>MPhil</option>
        </select>
    </div>

    <script>
        function showDropdown() {
            document.getElementById("otherDegree").style.display = "block";
        }

        function hideDropdown() {
            document.getElementById("otherDegree").style.display = "none";
        }
    </script>

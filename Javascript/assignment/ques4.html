<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4</title>
</head>
<body>

Name:
<input type="text" id="name">
<button onclick="add()">Submit</button>

<br><br>

Enter Roll Number:
<select id="roll" onclick="showName()">
    <option value="">Select</option>
</select>

<p id="result"></p>

<script>
let students = [];

function add() {
    let n = document.getElementById("name").value;

    students.push(n);

    let opt = document.createElement("option");
    opt.text = students.length;
    opt.value = students.length - 1;

    document.getElementById("roll").appendChild(opt);
    document.getElementById("name").value = "";
}

function showName() {
    let r = document.getElementById("roll").value;

    if (r !== "") {
        document.getElementById("result").innerHTML = students[r];
    }
}
</script>

</body>
</html>

<html>
<head>
    <title>Q7</title>
</head>
<body>

Enter element:
<input id="x">
<button onclick="add()">Add</button>

<p>The Entered array is: <span id="result"></span></p>

Index 
<select id="idx" onclick="show()">
    <option>-</option>
</select> 
Th element is: <span id="val"></span>

<p>The array in sorted order is: <span id="srt"></span></p>

Search: <input id="s"> 
<button onclick="find()">Search</button>
<span id="res"></span>

<p>The reversed array is: <span id="rev"></span></p>

<script>
let array = [];

function add() {
    array.push(x.value);
    
    result.innerHTML = array;
    
    idx.innerHTML += `<option value="${array.length-1}">${array.length-1}</option>`;
    
    srt.innerHTML = [...array].sort();
    
    rev.innerHTML = [...array].reverse();
}

function show() {
    val.innerHTML = array[idx.value];
}

function find() {
    let index = array.indexOf(s.value);
    if (index > -1) {
        res.innerHTML = "Found at index " + index;
    } else {
        res.innerHTML = "Not found";
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3</title>
</head>
<body>

First Number:
<input id="a"><br><br>

Second Number:
<input id="b"><br><br>

<button onclick="c()">Compare</button>

<p id="r"></p>

<script>
function c() {
    if (a.value > b.value)
        r.innerHTML = "First is greater";
    else if (a.value < b.value)
        r.innerHTML = "Second is greater";
    else
        r.innerHTML = "Equal";
}
</script>

</body>
</html>

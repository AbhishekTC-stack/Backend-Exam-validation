<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q10</title>
</head>
<body>

    Enter elements (separated by commas): <input type="text" id="arrayInput">
    <br><br>
    
    <button onclick="findMaximum()">Maximum</button>

    <p id="result"></p>

    <script>
        function findMaximum() {
            let input = document.getElementById('arrayInput').value;
            
            let strArray = input.split(',');
            
            let max = parseInt(strArray[0]);

            for (let i = 1; i < strArray.length; i++) {
                let Num = parseInt(strArray[i]);
                
                if (Num > max) {
                    max = Num;
                }
            }

            document.getElementById('result').innerHTML = "Largest element: " + max;
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
        let a=3,
        b=6
        switch('#')
        {
        case `+` :{document.write(`Sum of a and b is`,a+b);
                break;}
       
         case `-` :{document.write(`Difference of a and b is`,a-b);
                break;}

             case `*` :{document.write(`Product of a and b is`,a*b);
                break;}
        case '%':{
            document.write("<br> Remainder of a & b is", a%b)
            break;
        }
        default:{
            document.write("Not an operator")
        }
        
        }
        
    </script>
</body>
</html>

//multiple of 3 or 7
  
function checkMultiple(num) {
  if (num % 3 === 0 && num % 7 === 0) {
    document.write(num + " is a multiple of both 3 and 7");
  } else if (num % 3 === 0) {
    document.write(num + " is a multiple of 3");
  } else if (num % 7 === 0) {
    document.write(num + " is a multiple of 7");
  } else {
    document.write(num + " is not a multiple of 3 or 7");
  }
}

//quadratic equation

function quadraticRoots(a, b, c) {
  let discriminant = b * b - 4 * a * c;

  if (discriminant > 0) {

    let root1 = (-b + Math.sqrt(discriminant)) / (2 * a);
    let root2 = (-b - Math.sqrt(discriminant)) / (2 * a);
    console.log("Roots are real and different:");
    console.log("Root 1 = " + root1);
    console.log("Root 2 = " + root2);

  } else if (discriminant === 0) {
    
    let root = -b / (2 * a);
    console.log("Roots are real and equal:");
    console.log("Root = " + root);

  } else {
    
    let realPart = (-b / (2 * a)).toFixed(2);
    let imagPart = (Math.sqrt(-discriminant) / (2 * a)).toFixed(2);

    console.log("Roots are complex:");
    console.log(`Root 1 = ${realPart} + ${imagPart}i`);
    console.log(`Root 2 = ${realPart} - ${imagPart}i`);
  }
}

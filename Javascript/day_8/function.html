<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        function greet(name){
            document.write("Hello, " + name);
        }

        //function call
        greet("world!");
        greet("<br>PM AJAY!");
        document.write("<br>");

        // Addition
        function add(a,b){
            return a+b;
        }
        let sum = add(5,10);
        document.write("Sum is: " + sum + "<br><br>");

        // Subtraction
        function sub(a,b){
            return a-b;
        }
        let subtraction = sub(10,5);
        document.write("Difference is: " + subtraction + "<br><br>");

        // Multiplication
        function multiply(a,b){
            return a*b;
        }
        let product = multiply(10,5);
        document.write("Product is: " + product + "<br><br>");

        // Division
        function divide(a,b){
            return a/b;
        }
        let division = divide(100,10);
        document.write("Division result is: " + division);

    </script>
</body>
</html>

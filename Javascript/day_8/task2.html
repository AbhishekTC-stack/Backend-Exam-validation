<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Reading Data from HTML</h1>

    <label for="nameInput">Enter your name:</label>
    <input type="text" id="nameInput">   <!-- Missing input added -->

    <button onclick="showName()">Show name</button>

    <p id="output"></p>

    <script>
        function showName(){
            let name = document.getElementById('nameInput').value;  // Correct ID
            document.getElementById('output').textContent = 'Hello, ' + name;
        }
    </script>
</body>
</html>

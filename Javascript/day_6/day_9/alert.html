<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function showAlert() {
            window.alert("Hello from window object");
            console.log(this); // window object
        }
        showAlert(); // corrected function call

        let person = {
            name: `Ram`,
            greet: function() {
                console.log(`Hello ` + this.name); // Hello Ram
            }
        };
        person.greet(); // corrected method name

        let arrowGreet = () => {
            document.write(`Arrow function context is: `, this);
            // this → window (because arrow functions don't have their own this)
        };
        arrowGreet(); // corrected function call
    </script>
</body>
</html>

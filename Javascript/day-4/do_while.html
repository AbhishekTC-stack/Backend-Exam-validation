<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let i=5;
        do{
            document.write(`This is a do while loop`)
        }
        while(i>=20)
            document.write(`<br>`,i++)
        i++
        
    </script>
</body>
</html>

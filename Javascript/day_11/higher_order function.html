    <h1>Higher order functions</h1>
    <script>
        let numbers = [1,2,3,4,5]
      

document.write('<br>')
//number *2 using aarrow
        let numbers1 = [1,2,3,4,5]
        let doubled1 = numbers.map(n => n*2);
          
    
        document.write(doubled1);
document.write('<br>')

        const squares = numbers.map(n => n*n);
        document.write(squares)
document.write('<br>')

let even = numbers.filter(n=>n%2==0)
document.write(even)
document.write('<br>')
let sum = numbers.reduce((total,n)=> total+n);
document.write(sum)
document.write('<br>')

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

//divide an array

let a = [20, 25, 30, 35, 40, 45];

let firstHalf = a.slice(0, a.length / 2);
let secondHalf = a.slice(a.length / 2);

document.write("First Array:", firstHalf);
document.write("Second Array:", secondHalf);
document.write('<br>')
document.write('<br>')


//concatenate 2 arrays

let array1 = [1, 2, 3, 4];
let array2 = [5, 6, 7, 8];

let result = array1.concat(array2);

document.write("Concatenated Array:", result);
document.write('<br>')
document.write('<br>')


//even number storing 

let evens = [];

for (let i = 1; i <= 20; i++) {
  if (i % 2 === 0) {
    evens.push(i);
  }
}

document.write("Even numbers up to 20:", evens);
document.write('<br>')
document.write('<br>')


//check wheather a number is presnt in an array

let arr1 = [10, 11, 15, 17, 19, 23];
let num = 11;

let index = arr1.indexOf(num);

if (index !== -1) {
document.write(num + " is found at location:", index);
} else {
 document.write(num + " is NOT found in the array");
}
document.write('<br>')
document.write('<br>')

//count the occurence of 2 array

let arr = [1, 6, 7, 8, 2, 3, 4, 2, 2];
let count = 0;

for (let i = 0; i < arr.length; i++) {
  if (arr[i] === 2) {
    count++;
  }
}

document.write("Occurrence of 2:", count);


    </script>
</body>
</html>

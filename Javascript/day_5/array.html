<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- `````````````````````````````` -->
    <!-- ARRAAAAYYYYYYYYYYYYYYYYYYYYYYY -->
    <!-- `````````````````````````````` -->
    <script>
        let a = [2, 4, 7, 8, 5, 6]
        // document.write(a[2])

        // document.write(`<br><br>Sum of of 8 and 6=<b>${a[3]+a[5]}</b>`)

        // document.write(`<br><br>Product of of 2 and 6=<b>${a[0]*a[5]}</b>`)

        a[6] = 10
        document.write("<br><br> <b>The given array is:</b> <br>", a)
        a[3] = 9
        document.write("<br><br> <b>The given array is:</b> <br>", a)

        //---------------------------------------
        //--------LENGTH OF AN ARRAY-------------
        //-----------------------------------------
        document.write("<br><br> <b>Length of the given array is:</b> = ", a.length)

        //--------------------------------------
        //----------PUSHHHHHHHHHHHHH------INSERT ELEMENT TO LAST
        //--------------------------------------
        a.push(12)
        document.write("<br><br> <b>The given array is:</b> <br>", a)

        //--------------------------------------
        //----------POPPPPPPPPPPPPP------DELETE LAST ELEMENT
        //--------------------------------------

        k = a.pop()
        document.write("<br><br><B>element popped is:</B> <br>", k)

        let b = []
        for (i = 0; i < 5; i++) {
            b[i] = i + 1
        }
        document.write("<br><br> <b>--------------------------------------------------------------------------------------</b> <br>")
        document.write("<br><br> <b>The given array is:</b> <br>", b)

        //2,4,6,8,10

        let c = []
        let j = 2
        for (i = 0; i < 5; i++) {
            c[i] = j
            j = j + 2
        }
        document.write("<br><br> <b>The given array of even numbers is:</b> <br>", c)

        c = []
        j = 1
        for (i = 0; i < 5; i++) {
            c[i] = j
            j = j + 2
        }
        document.write("<br><br> <b>The given array of odd numbers is:</b> <br>", c)


        for (i = 0; i < 5; i++) {
            c[i] = c[i] + 2

        }
        document.write("<br><br> <b>The given array of odd numbers after adding 2 to each element is:</b> <br>", c)

        for (i = 0; i < 5; i++) {
            c[i] = c[i] * 2

        }
        document.write("<br><br> <b>Twice the value of each element is:</b> <br>", c)

        s = 0
        for (i = 0; i < 5; i++) {

            s = c[i] + s

        }
        document.write("<br><br> <b>Sum of all elements in the array is:</b> <br>", s)

        p = 1
        for (i = 0; i < 5; i++) {

            p = c[i] * p

        }
        document.write("<br><br> <b> Sum of all elements in the array is:</b> <br>", p)
        

    </script>
</body>

</html>
